<div class="container pt-5">
    <div class="row">
        <div class="col-md-12">
            <div class="outer-white">
                <div class="dot dot-white-1"></div>
                <div class="dot dot-white-2"></div>
                <div class="dot dot-white-3"></div>
            </div>

            <div class="card-body-style text-dark bg-white skill-sets">
                <h2 class="mb-4">Contact Me</h2>
                <div>
                    <form [formGroup]="contactForm" onsubmit="submitContact()">
                        <div class="row">
                            <div class="col-md-6">
                                <mat-form-field appearance="fill">
                                    <mat-label>First Name</mat-label>
                                    <input matInput placeholder="Enter First Name" formControlName="fname" required>
                                    <mat-error *ngIf="checkError('fname','required')" >Required</mat-error>
                                  </mat-form-field>
                            </div>
                            <div class="col-md-6">
                                <mat-form-field appearance="fill">
                                    <mat-label>Last Name</mat-label>
                                    <input matInput placeholder="Enter Last Name" formControlName="lname" required>
                                    <mat-error *ngIf="checkError('lname','required')" >Required</mat-error>
                                  </mat-form-field>
                            </div>
                            <div class="col-md-6">
                                <mat-form-field appearance="fill">
                                    <mat-label>Email</mat-label>
                                    <input matInput type="email" placeholder="Enter Email" formControlName="email" required>
                                    <mat-error *ngIf="checkError('email','required')" >Required</mat-error>
                                    <mat-error *ngIf="checkError('email','email')" >Please Enter Correct Address</mat-error>
                                </mat-form-field>
                            </div>
                            <div class="col-md-6">
                                <mat-form-field appearance="fill">
                                    <mat-label>Phone</mat-label>
                                    <input matInput type="number" placeholder="Enter Phone" formControlName="phone" required>
                                    <mat-error *ngIf="checkError('phone','required')" >Required</mat-error>
                                  </mat-form-field>
                            </div>
                            <div class="col-md-12">
                                <mat-form-field appearance="fill">
                                    <mat-label>Message</mat-label>
                                    <textarea matInput type="text" placeholder="Enter Message" formControlName="message" required></textarea>
                                    <mat-error *ngIf="checkError('message','required')" >Required</mat-error>
                                </mat-form-field>
                            </div>

                            <div class="col-md-12 position-relative">
                                <button [ngStyle]="{'left.px': moveLeft}"   type="submit" class="move-button"  (mouseenter)="mouseEnter()" mat-raised-button color="primary">Send</button>
                            </div>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
